services:
  kash:
    build:
      context: .
      dockerfile: Dockerfile
    image: kash-server:latest
    container_name: kash-server
    restart: unless-stopped
    # All config (SESSION_SECRET, SERVER_PORT, PRODUCTION, paths) comes from .env.
    env_file:
      - .env
    # Bound to localhost; expose it publicly however you like (e.g. a reverse
    # proxy or a Cloudflare Tunnel running on the host). Must match SERVER_PORT.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Bind mount: use the existing ./data/users.db on the host.
      - ./data:/app/data
